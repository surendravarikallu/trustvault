<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36" fill="none">
  <defs>
    <linearGradient id="tv-asset-shield" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="tv-asset-inner" x1="8" y1="6" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="tv-asset-v" x1="16" y1="8" x2="16" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="tv-asset-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#2563eb" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Logo Mark (Shield with V Monogram) -->
  <g transform="translate(2, 2)">
    <path
      d="M 16 2 L 28 6.5 V 15 C 28 22.8 22.8 28.8 16 30.5 C 9.2 28.8 4 22.8 4 15 V 6.5 Z"
      fill="url(#tv-asset-shield)"
      filter="url(#tv-asset-glow)"
    />
    <path
      d="M 16 3.6 L 26.5 7.6 V 15 C 26.5 21.8 21.9 27.2 16 28.8 C 10.1 27.2 5.5 21.8 5.5 15 V 7.6 Z"
      fill="url(#tv-asset-inner)"
      stroke="#60a5fa"
      stroke-width="0.8"
    />
    <path
      d="M 9.5 9.5 L 16 22.5 L 22.5 9.5 H 19.5 L 16 16.8 L 12.5 9.5 Z"
      fill="url(#tv-asset-v)"
    />
    <circle cx="16" cy="12" r="2.6" fill="#0a101d" stroke="#38bdf8" stroke-width="0.9" />
    <path
      d="M 15.3 11.6 C 15.3 11.2 15.6 10.9 16 10.9 C 16.4 10.9 16.7 11.2 16.7 11.6 C 16.7 11.9 16.5 12.1 16.3 12.3 L 16.5 14.2 H 15.5 L 15.7 12.3 C 15.5 12.1 15.3 11.9 15.3 11.6 Z"
      fill="#ffffff"
    />
    <circle cx="16" cy="25.5" r="1.2" fill="#10b981" />
  </g>

  <!-- Brand Typography: TrustValt (matching trustvalt.me) -->
  <text x="42" y="23" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.03em" fill="#f8fafc">
    Trust<tspan fill="#38bdf8">Valt</tspan>
  </text>
</svg>
